<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="knightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
    <linearGradient id="greenVinyl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#739552" />
      <stop offset="100%" stop-color="#55703b" />
    </linearGradient>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#greenVinyl)" stroke-width="8" opacity="0.8" />

  <!-- Chess Board Pattern Accent in Background -->
  <g opacity="0.12">
    <rect x="76" y="76" width="90" height="90" fill="#ffffff" />
    <rect x="256" y="76" width="90" height="90" fill="#ffffff" />
    <rect x="166" y="166" width="90" height="90" fill="#ffffff" />
    <rect x="346" y="166" width="90" height="90" fill="#ffffff" />
    <rect x="76" y="256" width="90" height="90" fill="#ffffff" />
    <rect x="256" y="256" width="90" height="90" fill="#ffffff" />
    <rect x="166" y="346" width="90" height="90" fill="#ffffff" />
    <rect x="346" y="346" width="90" height="90" fill="#ffffff" />
  </g>

  <!-- Polished Knight Silhouette -->
  <g transform="translate(64, 40) scale(0.75)" fill="url(#knightGrad)" stroke="#111827" stroke-width="10" stroke-linejoin="round">
    <path d="M 340 450 L 170 450 L 170 420 C 190 410 210 390 220 370 C 180 360 150 330 140 290 C 135 270 140 240 160 210 C 170 195 185 185 200 180 C 195 160 200 135 220 110 C 235 90 260 80 290 85 C 310 90 325 105 330 120 C 345 105 365 100 385 105 C 400 110 410 125 410 145 C 410 170 395 210 380 240 C 370 260 360 270 375 290 C 390 310 390 340 370 370 C 360 385 350 410 340 450 Z" />
    <!-- Mane details -->
    <path d="M 270 115 C 290 140 295 180 280 210" fill="none" stroke="#9ca3af" stroke-width="12" stroke-linecap="round" />
    <path d="M 330 150 C 350 180 345 220 330 250" fill="none" stroke="#9ca3af" stroke-width="12" stroke-linecap="round" />
    <!-- Eye and Snout -->
    <circle cx="215" cy="180" r="14" fill="#111827" />
    <path d="M 160 270 C 180 280 200 275 220 260" fill="none" stroke="#9ca3af" stroke-width="10" stroke-linecap="round" />
    <!-- Base pedestal -->
    <rect x="150" y="445" width="210" height="35" rx="10" fill="url(#goldGrad)" stroke="#111827" stroke-width="8" />
  </g>

  <!-- Crown / Star Accent -->
  <polygon points="256,42 266,66 292,66 271,82 279,106 256,91 233,106 241,82 220,66 246,66" fill="url(#goldGrad)" />
</svg>
